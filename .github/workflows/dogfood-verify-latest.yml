name: Dogfood Gate Verify Latest

on:
  push:
    branches:
      - dogfood-gate-1-native

jobs:
  verify-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Dogfood focused tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/dogfood_*.test.ts)
          for f in "${files[@]}"; do
            echo "==> $f"
            npx tsx "$f"
          done
      - run: npm test
      - run: npm run lint
      - run: npm run build
