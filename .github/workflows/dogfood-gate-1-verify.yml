name: Hardstate Quality Gate

on:
  push:
    branches:
      - dogfood-gate-1
      - dogfood-gate-1-android-apk
      - "opencode/**"
  pull_request:
    branches:
      - dogfood-gate-1
      - dogfood-gate-1-android-apk
      - "opencode/**"
  workflow_dispatch:

concurrency:
  group: hardstate-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
