name: Dogfood Gate 1 Verify

on:
  push:
    branches:
      - dogfood-gate-1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock if needed
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "forge-ci"
            git config user.email "forge-ci@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lock"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
