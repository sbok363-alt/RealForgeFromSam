<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FORGE Steps Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            black: '#000000',
            charcoal: '#121212',
            charcoalLight: '#1c1c1c',
            forgeBlue: '#0066FF',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    
    body { 
      background-color: #000; 
      color: #fff; 
      font-family: 'Inter', sans-serif; 
      -webkit-font-smoothing: antialiased; 
    }
    
    .nav-halo {
      box-shadow: 0 -10px 40px -10px rgba(0, 102, 255, 0.25);
      border-top: 1px solid rgba(0, 102, 255, 0.15);
    }
    
    .glowing-button {
      box-shadow: 0 0 20px rgba(0, 102, 255, 0.4);
    }
    
    .nested-card {
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.02), 0 4px 12px rgba(0,0,0,0.5);
    }

    .badge {
      box-shadow: 0 0 10px rgba(255,0,0,0.5);
    }

    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input { outline: none; }
    
    /* Hide scrollbar for a native app feel */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-black text-white h-screen flex justify-center overflow-hidden">
  
  <div class="w-full max-w-md h-full flex flex-col relative overflow-y-auto pb-28">
    
    <!-- Header & Top Custom Animated Chart -->
    <div class="flex justify-between items-start p-6">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">FORGE</h1>
        <p class="text-gray-400 text-sm mt-1">Good afternoon, Alex.</p>
      </div>
      <div class="w-16 h-12 relative flex justify-end">
        <!-- Canvas for Glowing Bar Chart -->
        <canvas id="progressChart" width="60" height="48"></canvas>
      </div>
    </div>

    <!-- 1. Goal Setting Section -->
    <div class="px-6 mb-5">
      <div class="bg-charcoal p-4 rounded-2xl border border-white/5">
        <h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3">Daily Step Goal</h2>
        <div class="flex gap-2">
          <input type="number" id="goalInput" class="flex-1 bg-charcoalLight border border-white/10 rounded-xl px-4 py-2.5 text-white font-mono text-sm" placeholder="e.g. 10000">
          <button id="setGoalBtn" class="bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-5 rounded-xl transition-colors text-sm">Set</button>
        </div>
      </div>
    </div>

    <!-- 2. Daily Log Section -->
    <div class="px-6 mb-7">
      <div class="bg-charcoal p-4 rounded-2xl border border-white/5">
        <div class="flex justify-between items-end mb-3">
          <h2 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider">Log Steps</h2>
          <span class="text-forgeBlue font-bold font-mono text-sm" id="progressText">0 / 10000</span>
        </div>
        <div class="flex gap-2">
          <input type="number" id="stepInput" class="flex-1 bg-charcoalLight border border-white/10 rounded-xl px-4 py-2.5 text-white font-mono text-sm" placeholder="Steps walked">
          <button id="logStepsBtn" class="bg-forgeBlue glowing-button hover:bg-blue-600 text-white font-bold py-2 px-5 rounded-xl transition-colors flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Briefing & Primary Action Button -->
    <div class="px-6 mb-8">
      <p class="text-gray-300 text-sm mb-5 font-medium leading-relaxed">Your FORGE briefing is ready. Time to hit your targets and push your limits today.</p>
      <button class="w-full bg-forgeBlue glowing-button hover:bg-blue-600 text-white font-extrabold py-4 rounded-2xl flex items-center justify-center gap-2 text-lg transition-transform active:scale-95">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        READY JUST GO
      </button>
    </div>

    <!-- Next Session Nested Card -->
    <div class="px-6 mb-8">
      <div class="bg-charcoal p-5 rounded-3xl border border-white/5 nested-card">
        <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-4">Next Session</h3>
        
        <div class="bg-charcoalLight p-4 rounded-2xl border border-white/5 mb-4 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h4 class="font-bold text-lg">Hypertrophy Upper</h4>
            <span class="text-xs font-mono bg-white/5 border border-white/10 px-2 py-1 rounded text-gray-400 font-semibold">60 MIN</span>
          </div>
          <div class="flex flex-wrap gap-1.5 mb-1">
            <span class="text-[10px] font-bold bg-black border border-white/10 px-2 py-1.5 rounded-md text-gray-300">Barbell Bench Press</span>
            <span class="text-[10px] font-bold bg-black border border-white/10 px-2 py-1.5 rounded-md text-gray-300">Barbell Row</span>
            <span class="text-[10px] font-bold bg-black border border-white/10 px-2 py-1.5 rounded-md text-gray-300">Overhead Press</span>
            <span class="text-[10px] font-bold bg-black border border-white/10 px-2 py-1.5 rounded-md text-gray-300">+3 more</span>
          </div>
        </div>

        <button class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-forgeBlue font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-colors text-sm">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          JUST GO
        </button>
      </div>
    </div>

    <!-- Bottom Navigation Bar (Fixed) -->
    <div class="fixed bottom-0 left-0 w-full bg-black/80 backdrop-blur-xl nav-halo py-4 px-6 z-50 flex justify-between items-center max-w-md mx-auto right-0 border-t border-forgeBlue/20">
      
      <!-- Dashboard -->
      <button class="text-gray-500 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      </button>
      
      <!-- Workouts (Active) -->
      <button class="text-forgeBlue transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
      </button>
      
      <!-- Brain Icon - Glowing Center -->
      <button class="bg-charcoalLight border border-forgeBlue/40 w-12 h-12 rounded-full flex items-center justify-center glowing-button -mt-8 relative z-10">
        <svg class="w-6 h-6 text-forgeBlue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
      </button>
      
      <!-- Stats w/ Red Badge -->
      <button class="text-gray-500 hover:text-white transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full badge"></span>
      </button>
      
      <!-- Profile -->
      <button class="text-gray-500 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      </button>

    </div>
  </div>

  <script>
    // LocalStorage Initialization & State
    let goal = parseInt(localStorage.getItem('forge_steps_goal')) || 10000;
    let currentSteps = parseInt(localStorage.getItem('forge_steps_current')) || 0;

    // DOM Elements
    const goalInput = document.getElementById('goalInput');
    const stepInput = document.getElementById('stepInput');
    const setGoalBtn = document.getElementById('setGoalBtn');
    const logStepsBtn = document.getElementById('logStepsBtn');
    const progressText = document.getElementById('progressText');
    const canvas = document.getElementById('progressChart');
    const ctx = canvas.getContext('2d');

    // Setup initial UI
    goalInput.value = goal;
    updateUI();

    // Event Listeners
    setGoalBtn.addEventListener('click', () => {
      const val = parseInt(goalInput.value);
      if (val > 0) {
        goal = val;
        localStorage.setItem('forge_steps_goal', goal);
        animateChart(); // Re-animate based on new goal ratio
        updateUI();
      }
    });

    logStepsBtn.addEventListener('click', () => {
      const val = parseInt(stepInput.value);
      if (val > 0) {
        currentSteps += val;
        localStorage.setItem('forge_steps_current', currentSteps);
        stepInput.value = '';
        animateChart();
        updateUI();
      }
    });

    function updateUI() {
      progressText.innerText = `${currentSteps.toLocaleString()} / ${goal.toLocaleString()}`;
    }

    // 3. Visualization: Animated Glowing Bar Chart
    let currentRenderProgress = 0;
    
    function animateChart() {
      const targetProgress = Math.min(currentSteps / goal, 1);
      
      const drawFrame = () => {
        // Easing function for smooth animation
        currentRenderProgress += (targetProgress - currentRenderProgress) * 0.08;
        
        drawChart(currentRenderProgress);
        
        if (Math.abs(targetProgress - currentRenderProgress) > 0.005) {
          requestAnimationFrame(drawFrame);
        } else {
          drawChart(targetProgress); // Snap to exact target at end of animation
        }
      };
      
      requestAnimationFrame(drawFrame);
    }

    function drawChart(progressRatio) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const numBars = 5;
      const barWidth = 7;
      const spacing = 4;
      // Fixed heights for the 5 bars to create an ascending/descending waveform aesthetic
      const maxHeights = [18, 30, 24, 40, 26]; 
      
      for (let i = 0; i < numBars; i++) {
        const x = i * (barWidth + spacing);
        const maxH = maxHeights[i];
        const y = canvas.height - maxH;
        
        // Draw Background Bar (Dim Charcoal)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, maxH, 4);
        ctx.fill();
        
        // Calculate fill percentage for THIS specific bar
        // We divide the total progress into 5 equal chunks
        const chunkThreshold = (i + 1) / numBars;
        const prevChunkThreshold = i / numBars;
        
        if (progressRatio > prevChunkThreshold) {
          // Calculate how full this specific bar should be (0.0 to 1.0)
          const barFillRatio = Math.min(1, (progressRatio - prevChunkThreshold) * numBars);
          const fillH = maxH * barFillRatio;
          const fillY = canvas.height - fillH;
          
          // Apply Electric Blue Glow
          ctx.shadowColor = '#0066FF';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#0066FF';
          
          ctx.beginPath();
          // Draw from the bottom up
          ctx.roundRect(x, fillY, barWidth, fillH, 4);
          ctx.fill();
          
          // Reset shadow for next element
          ctx.shadowBlur = 0;
        }
      }
    }
    
    // Trigger initial chart draw animation on load
    animateChart();
  </script>
</body>
</html>
